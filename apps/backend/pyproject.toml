[project]
name = "pg-backend"
version = "0.1.0"
description = "FastAPI service for Problem Generator"
authors = [{ name = "PG Team" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "structlog>=24.1",
  "redis>=5.0",
  "sympy>=1.12",
  "pint>=0.23",
  "numpy>=1.26",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "hypothesis>=6.99",
  "anyio>=4.3",
  "httpx>=0.27",
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.9"
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
