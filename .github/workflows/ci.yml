name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install backend dependencies
        run: python -m pip install -e apps/backend -e packages/problemkit
      - name: Run lint
        run: pnpm lint
      - name: Run tests
        run: pnpm test
