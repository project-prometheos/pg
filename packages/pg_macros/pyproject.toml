[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg_macros"
version = "0.1.0"
description = "PG macro library - Python ports of WeBWorK Perl macros"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pg_parser>=0.1.0",
    "pg_math>=0.1.0",
    "pg_answer>=0.1.0",
    "pg_pgml>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pg_macros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["pg_macros"]
omit = ["*/tests/*", "*/test_*.py"]
