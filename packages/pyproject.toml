[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg"
version = "0.1.0"
description = "WeBWorK Problem Generation System"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = [
    "pg",
    "pg.parser",
    "pg.math",
    "pg.answer",
    "pg.pgml",
    "pg.macros",
    "pg.translator",
    "pg.renderer",
]
package-dir = {"" = "."}
