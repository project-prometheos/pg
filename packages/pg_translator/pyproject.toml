[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg_translator"
version = "0.1.0"
description = "PG problem file translator and executor for WeBWorK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pg_parser>=0.1.0",
    "pg_math>=0.1.0",
    "pg_answer>=0.1.0",
    "pg_pgml>=0.1.0",
    "RestrictedPython>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pg_translator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["pg_translator"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
